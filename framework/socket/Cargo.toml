# Allowed outside crates:
# - libc
# - serde
# - serde_json
#
# Allowed workspace crates:
# - nova-carrier
# - nova-hub
# - nova-log

[package]
name = "nova-socket"
description = "novad's socket: accepts clients, routes their requests by type and writes their queues"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
# The short write timeout novad's tests wait out.
test-support = []

[dependencies]
nova-carrier.workspace = true
nova-hub.workspace = true
nova-log.workspace = true
libc.workspace = true
serde.workspace = true
serde_json.workspace = true

[lints]
workspace = true
