# cargo-deny: `nix flake check` runs it offline against the advisory database
# pinned in flake.lock; `just deny` runs it against the latest one.

[graph]
# Nova only runs on Linux, so Windows-only crates don't count.
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu"]

[advisories]
# Vulnerabilities and unmaintained crates fail. Yanked crates need the live
# crates.io index, which the offline check can't reach.
yanked = "allow"

[licenses]
# Permissive licenses that sit fine in an MIT project.
allow = ["MIT", "Apache-2.0", "ISC", "BSD-3-Clause", "Unicode-3.0", "CDLA-Permissive-2.0"]

[bans]
# Two versions of one crate fail. When a dependency forces one, list it under
# `skip` with the reason.
multiple-versions = "deny"
skip = [
    # toml 0.8 parses with winnow 0.7 and zbus 6 with winnow 1; both are
    # current releases, so this goes away when toml moves to winnow 1.
    { crate = "winnow@0.7", reason = "toml 0.8 and zbus 6 pin different winnow majors" },
    # png 0.18 inflates with miniz_oxide 0.8 itself but encodes through
    # flate2, whose current release is on miniz_oxide 0.9.
    { crate = "miniz_oxide@0.8", reason = "png 0.18 and its flate2 pin different miniz_oxide versions" },
    # ring (ureq's rustls) is still on getrandom 0.2; zip 9 needs 0.4.
    { crate = "getrandom@0.2", reason = "ring 0.17 and zip 9 pin different getrandom majors" },
    # pulseaudio 0.3's derive macros (enum-primitive-derive, thiserror 1)
    # are still on syn 2; the rest of the tree is on syn 3. Build time only.
    { crate = "syn@2", reason = "pulseaudio 0.3's derive macros are on syn 2, everything else on syn 3" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
