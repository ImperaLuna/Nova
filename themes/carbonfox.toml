# Carbonfox, Nova's default theme. Mirrors modules/_lib/themes/carbonfox.nix
# in nix-config, with upstream Carbonfox's green and red for success/error,
# and a warmer white text made for Nova's smoked glass.
#
# A theme has a [dark] table and may have a [light] one. Each table sets
# every color token exactly once (novad refuses missing or unknown ones).
# The UI's Tokens.qml exposes them under these names.

name = "Carbonfox"

[dark]
# Backgrounds
bg = "#1D1D1D"        # main background
bgAlt = "#393E46"     # secondary background, borders, selection
backdrop = "#000000"  # behind everything, like the lock screen
glassTint = "#0A0807" # glass: a warm near-black over the compositor's blur

# Foregrounds
fg = "#FFF6EB"        # text and icons; Tokens derives the dimmer levels

# Accents
primary = "#FD7014"   # main accent, highlights
secondary = "#BE95FF" # secondary accent, "needs a decision"
onAccent = "#1D1D1D"  # text on solid accent fills

# Status
info = "#00ADB5"
success = "#25BE6A"
warning = "#FAEB92"
error = "#EE5396"

# Swatches: distinct colors for things told apart by color (workspaces,
# tags, graph lines), used in order
swatch1 = "#5988DB"   # blue
swatch2 = "#E8650E"   # orange
swatch3 = "#07A7A5"   # teal
swatch4 = "#9067CC"   # purple
swatch5 = "#029A43"   # green
swatch6 = "#049BE7"   # cyan
swatch7 = "#DD6098"   # magenta
swatch8 = "#9C7C02"   # yellow

# Derived from the dark set for light surfaces (the palette artifact's light
# draft). Same token roles.
[light]
# Backgrounds
bg = "#F6F2EA"
bgAlt = "#DDD6C8"
backdrop = "#FFFFFF"
glassTint = "#F4EADF"

# Foregrounds
fg = "#26231F"

# Accents
primary = "#C4520A"
secondary = "#7A4FD0"
onAccent = "#FFFFFF"

# Status
info = "#00838A"
success = "#167A43"
warning = "#8A6D00"
error = "#C8215F"

# Swatches: distinct colors for things told apart by color (workspaces,
# tags, graph lines), used in order
swatch1 = "#507ED1"   # blue
swatch2 = "#CC5809"   # orange
swatch3 = "#008D88"   # teal
swatch4 = "#7349AB"   # purple
swatch5 = "#017833"   # green
swatch6 = "#0B84C5"   # cyan
swatch7 = "#A62C69"   # magenta
swatch8 = "#937506"   # yellow
