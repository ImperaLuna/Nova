id = "files"
name = "Nova Files"
description = "A file manager in Nova's look, opened for every folder and every app's \"Show in folder\"."
default = true
daemon = "files"

# The drives in the sidebar come from udisks2 (udisksd) on the system bus,
# which most desktops already run; the NixOS module turns it on. The
# preview pane draws a PDF's first page with poppler's pdftoppm and a
# video's still with ffmpeg. Thumbnails of images come from gdk-pixbuf's
# thumbnailer and of videos from ffmpegthumbnailer, as in GNOME's file
# manager; any other thumbnailer installed is used too. Without them Nova
# Files works, with no drives listed, those previews or thumbnails, so none
# is checked for.
[variants.default]
nix = ["udisks2", "poppler-utils", "ffmpeg-headless", "gdk-pixbuf", "ffmpegthumbnailer"]
arch = ["udisks2", "poppler", "ffmpeg", "gdk-pixbuf2", "ffmpegthumbnailer"]
fedora = ["udisks2", "poppler-utils", "ffmpeg-free", "gdk-pixbuf2", "ffmpegthumbnailer"]
debian = ["udisks2", "poppler-utils", "ffmpeg", "libgdk-pixbuf2.0-bin", "ffmpegthumbnailer"]
