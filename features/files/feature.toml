id = "files"
name = "Nova Files"
description = "A file manager in Nova's look, opened for every folder and every app's \"Show in folder\"."
daemon = "files"

# The drives in the sidebar come from udisks2 (udisksd) on the system bus,
# which most desktops already run; the NixOS module turns it on. Without it
# Nova Files works, with no drives listed, so it isn't checked for.
[variants.default]
nix = ["udisks2"]
arch = ["udisks2"]
fedora = ["udisks2"]
debian = ["udisks2"]
