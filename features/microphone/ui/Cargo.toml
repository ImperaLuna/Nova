# nova-microphone-ui
#
# What the microphone feature draws with GPUI in quick settings: the tile
# that mutes the mic (`microphone.tile`) and its slider while an app
# records (`microphone.slider`), from the sound feature's state.
#
# Allowed outside crates:
# - gpui
#
# Allowed workspace crates:
# - nova-look
# - nova-sound-api
# - nova-stage
# - nova-ui-client

[package]
name = "nova-microphone-ui"
description = "The microphone feature's UI for the GPUI program: quick settings' mute tile and the mic slider while an app records"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
workspace = "../../../app-ui"

[dependencies]
gpui.workspace = true
nova-look.workspace = true
nova-sound-api.workspace = true
nova-stage.workspace = true
nova-ui-client.workspace = true

[lints]
workspace = true
