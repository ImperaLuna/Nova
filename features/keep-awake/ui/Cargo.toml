# nova-keep-awake-ui
#
# What keep awake draws with GPUI: its tile in quick settings
# (`keep-awake.tile`), which keeps every screen's stage holding off idle
# while it's on.
#
# Allowed outside crates:
# - gpui
#
# Allowed workspace crates:
# - nova-look
# - nova-stage

[package]
name = "nova-keep-awake-ui"
description = "Keep awake's UI for the GPUI program: the quick settings tile that holds off idle"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
workspace = "../../../app-ui"

[dependencies]
gpui.workspace = true
nova-look.workspace = true
nova-stage.workspace = true

[lints]
workspace = true
