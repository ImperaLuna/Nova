# nova-media-ui
#
# What the media feature draws with GPUI: the now-playing pill in the bar's
# left row (`media.pill`) and the panel it grows into, with the track's
# cover, the progress line, the buttons and the player chips.
#
# Allowed outside crates:
# - gpui
#
# Allowed workspace crates:
# - nova-look
# - nova-media-api
# - nova-stage
# - nova-ui-client

[package]
name = "nova-media-ui"
description = "The now-playing pill and panel for the GPUI program: title, equalizer, cover, seek, controls and player chips"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
workspace = "../../../app-ui"

[dependencies]
gpui.workspace = true
nova-look.workspace = true
nova-media-api.workspace = true
nova-stage.workspace = true
nova-ui-client.workspace = true

[lints]
workspace = true
