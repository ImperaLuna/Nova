# nova-clock-ui
#
# The clock feature's part of the central pill (`clock.time`): the day and
# the time, whose digits roll when they change.
#
# Allowed outside crates:
# - gpui
# - icu_calendar
# - icu_datetime
# - icu_locale_core
# - jiff
# - writeable
#
# Allowed workspace crates:
# - nova-locale
# - nova-look
# - nova-stage

[package]
name = "nova-clock-ui"
description = "The clock's part of the central pill for the GPUI program: the day and the time with rolling digits"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
workspace = "../../../app-ui"

[dependencies]
gpui.workspace = true
icu_calendar.workspace = true
icu_datetime.workspace = true
icu_locale_core.workspace = true
jiff.workspace = true
writeable.workspace = true
nova-locale.workspace = true
nova-look.workspace = true
nova-stage.workspace = true

[lints]
workspace = true
