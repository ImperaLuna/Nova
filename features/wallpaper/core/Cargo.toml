# Allowed outside crates:
# - imagesize
# - libc
# - png
# - serde
# - serde_json
#
# Allowed workspace crates:
# - nova-base
# - nova-carrier
# - nova-inotify
# - nova-log
# - nova-modules
# - nova-paths
# - nova-process
# - nova-settings
# - nova-wallpaper-api

[package]
name = "nova-wallpaper"
description = "Wallpapers: runs awww and linux-wallpaperengine to show the chosen ones, and lists the wallpaper folder"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
nova-wallpaper-api.workspace = true
nova-base.workspace = true
nova-carrier.workspace = true
nova-inotify.workspace = true
nova-log.workspace = true
nova-modules.workspace = true
nova-paths.workspace = true
nova-process.workspace = true
nova-settings.workspace = true
imagesize.workspace = true
libc.workspace = true
png.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
nova-base = { workspace = true, features = ["test-support"] }
nova-hub.workspace = true
nova-test-support.workspace = true

[lints]
workspace = true
