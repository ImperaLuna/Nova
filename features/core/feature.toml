id = "core"
name = "Core shell"
description = "Bar, notifications, volume OSD and quick settings."
default = true
required = true

# Quickshell runs the UI. On Nix the flake brings it; Fedora's comes from a
# COPR until it reaches a release, which `nova setup` enables.
[variants.default]
arch = ["quickshell"]
fedora = ["quickshell"]
debian = ["quickshell"]

[[slot]]
host = "bar.center"
view = "central-pill"
order = 10

# At the right edge, with the tray and the right-pill.buttons host.
[[slot]]
host = "bar.right"
view = "right-pill"
order = 20

# Quick settings' sound and microphone controls and keep awake.
[[slot]]
host = "quick-settings.tiles"
view = "keep-awake.tile"
order = 30

[[slot]]
host = "quick-settings.tiles"
view = "microphone.tile"
order = 40

[[slot]]
host = "quick-settings.sliders"
view = "sound.slider"
order = 10

[[slot]]
host = "quick-settings.sliders"
view = "microphone.slider"
order = 20

[[slot]]
host = "quick-settings.pages"
view = "sound.page"
