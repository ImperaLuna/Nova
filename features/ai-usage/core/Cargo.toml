# Allowed outside crates:
# - aes
# - base64
# - cbc
# - jiff
# - libc
# - pbkdf2
# - serde
# - serde_json
# - sha1
# - ureq
# - zbus
#
# Allowed workspace crates:
# - nova-ai-usage-api
# - nova-base
# - nova-hub
# - nova-inotify
# - nova-log
# - nova-modules
# - nova-paths
# - nova-session-bus

[package]
name = "nova-ai-usage"
description = "AI plan usage: reads Claude's and Codex's limits from their status line, session files and usage endpoints"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# The Claude desktop app's sealed sign-in, written as the app writes it, for
# novad's tests.
test-support = []

[dependencies]
nova-ai-usage-api.workspace = true
nova-base.workspace = true
nova-hub.workspace = true
nova-inotify.workspace = true
nova-log.workspace = true
nova-modules.workspace = true
nova-paths.workspace = true
nova-session-bus.workspace = true
aes.workspace = true
base64.workspace = true
cbc.workspace = true
jiff.workspace = true
libc.workspace = true
pbkdf2.workspace = true
serde.workspace = true
serde_json.workspace = true
sha1.workspace = true
ureq.workspace = true
zbus.workspace = true

[dev-dependencies]
nova-session-bus = { workspace = true, features = ["test-support"] }
nova-test-support.workspace = true

[lints]
workspace = true
