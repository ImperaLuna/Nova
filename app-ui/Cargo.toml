# nova-ui
#
# The program that draws Nova's UI with GPUI. Wiring only: it starts GPUI
# with the look kit's icons and the socket client and, as the ports land,
# the stage and each feature's ui crate.
#
# This manifest is also the root of the UI side's cargo workspace, apart
# from the daemon's (the repo root's): GPUI brings hundreds of crates, some
# in two versions, that novad's Cargo.lock, cargo-deny rules and static
# build never see this way. Its members are the crates that may use GPUI
# (AGENTS.md, Layout): this one, `framework-ui/<name>` and
# `features/<id>/ui`. Each of those names this workspace in its
# `[package]` (`workspace = "../../app-ui"`, one more `../` for a feature),
# since cargo would otherwise look for one from the repo root down.
# `[workspace.package]` and `[workspace.lints]` are copies of the root's,
# which `scripts/check-layout.sh` holds equal.
#
# Allowed outside crates:
# - gpui
# - gpui_platform
# - log
#
# Allowed workspace crates:
# - nova-ai-usage-ui
# - nova-bar-api
# - nova-bar-ui
# - nova-bluetooth-ui
# - nova-clock-ui
# - nova-daemon-info
# - nova-desktop-info
# - nova-keep-awake-ui
# - nova-launcher-ui
# - nova-lock-ui
# - nova-look
# - nova-media-ui
# - nova-microphone-ui
# - nova-network-ui
# - nova-notifications-ui
# - nova-peripherals-ui
# - nova-power-ui
# - nova-quick-settings-ui
# - nova-resources-ui
# - nova-screenshot-ui
# - nova-sound-ui
# - nova-stage
# - nova-theme-info
# - nova-tray-ui
# - nova-ui-client
# - nova-volume-osd-ui
# - nova-wallpaper-ui
# - nova-workspaces-ui

[package]
name = "nova-ui"
description = "Nova's UI, drawn with GPUI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
gpui.workspace = true
gpui_platform.workspace = true
log.workspace = true
nova-ai-usage-ui.workspace = true
nova-bar-api.workspace = true
nova-bar-ui.workspace = true
nova-bluetooth-ui.workspace = true
nova-clock-ui.workspace = true
nova-daemon-info.workspace = true
nova-desktop-info.workspace = true
nova-keep-awake-ui.workspace = true
nova-launcher-ui.workspace = true
nova-lock-ui.workspace = true
nova-look.workspace = true
nova-media-ui.workspace = true
nova-microphone-ui.workspace = true
nova-network-ui.workspace = true
nova-notifications-ui.workspace = true
nova-peripherals-ui.workspace = true
nova-power-ui.workspace = true
nova-quick-settings-ui.workspace = true
nova-resources-ui.workspace = true
nova-screenshot-ui.workspace = true
nova-sound-ui.workspace = true
nova-stage.workspace = true
nova-theme-info.workspace = true
nova-tray-ui.workspace = true
nova-ui-client.workspace = true
nova-volume-osd-ui.workspace = true
nova-wallpaper-ui.workspace = true
nova-workspaces-ui.workspace = true

[lints]
workspace = true

[workspace]
resolver = "3"
members = [".", "../framework-ui/*", "../features/*/ui"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.88"
# Nova is not on crates.io. cargo-deny also needs it to tell a path
# dependency from a wildcard version (app-ui/deny.toml).
publish = false

[workspace.dependencies]
# GPUI comes from Zed's repo through ImperaLuna/zed, the fork Nova Files
# pins too (its Cargo.toml lists the fixes on top of Zed's release). The
# crates.io release (0.2.2) draws through blade, which turns on ray tracing
# and makes NVIDIA's driver load CUDA. `version` picks Zed's real gpui: the
# repo also holds a test fixture crate named gpui. Move both pins together,
# and the hashes in packaging/nix/nova-ui.nix with them.
gpui = { git = "https://github.com/ImperaLuna/zed", rev = "47424cdc3f1a49829960e1ecbcdcdd967d034265", version = "0.2.2" }
# The platform half of GPUI (windows, input, the renderer). Wayland is off
# by default; without it the program runs but never opens a window.
gpui_platform = { git = "https://github.com/ImperaLuna/zed", rev = "47424cdc3f1a49829960e1ecbcdcdd967d034265", version = "0.1.0", features = ["wayland"] }
# The versions GPUI's own tree already holds.
futures = "0.3"
# What GPUI reports its own errors through: nova-ui prints them, so a lost
# Wayland connection says why in nova.log.
log = "0.4"
# Decoding frozen screens (grim's PPM), saved shots (PNG) and wallpapers at
# the size they are drawn, with the formats GPUI already builds it with.
image = { version = "0.25", default-features = false, features = ["bmp", "gif", "jpeg", "png", "pnm", "webp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
unicode-segmentation = "1"
# Fontconfig, which GPUI's text system already links: the look kit asks it
# which face a font token draws with, as Qt does.
yeslogic-fontconfig-sys = "6.0"
# The local time, for the clock: chrono, which GPUI uses, is unmaintained
# (RUSTSEC-2026-0543). The system's time zone from TZ or /etc/localtime.
jiff = { version = "0.2", default-features = false, features = ["std", "tz-system", "tzdb-zoneinfo"] }
# Words and order in the system's language from CLDR, as Qt uses them (the
# clock's day name, the launcher's app order). ICU4X's locale and data crates are already here through GPUI.
icu_calendar = "2.1"
icu_collator = "2.1"
icu_datetime = "2.1"
icu_locale_core = "2.1"
writeable = "0.6"

# The UI side's shared parts (framework-ui/).
nova-locale = { path = "../framework-ui/locale" }
nova-look = { path = "../framework-ui/look" }
nova-stage = { path = "../framework-ui/stage" }
nova-ui-client = { path = "../framework-ui/client" }

# Each feature's ui, sorted by feature id.
nova-ai-usage-ui = { path = "../features/ai-usage/ui" }
nova-bar-ui = { path = "../features/bar/ui" }
nova-bluetooth-ui = { path = "../features/bluetooth/ui" }
nova-clock-ui = { path = "../features/clock/ui" }
nova-keep-awake-ui = { path = "../features/keep-awake/ui" }
nova-launcher-ui = { path = "../features/launcher/ui" }
nova-lock-ui = { path = "../features/lock/ui" }
nova-media-ui = { path = "../features/media/ui" }
nova-microphone-ui = { path = "../features/microphone/ui" }
nova-network-ui = { path = "../features/network/ui" }
nova-notifications-ui = { path = "../features/notifications/ui" }
nova-peripherals-ui = { path = "../features/peripherals/ui" }
nova-power-ui = { path = "../features/power/ui" }
nova-quick-settings-ui = { path = "../features/quick-settings/ui" }
nova-resources-ui = { path = "../features/resources/ui" }
nova-screenshot-ui = { path = "../features/screenshot/ui" }
nova-sound-ui = { path = "../features/sound/ui" }
nova-tray-ui = { path = "../features/tray/ui" }
nova-volume-osd-ui = { path = "../features/volume-osd/ui" }
nova-wallpaper-ui = { path = "../features/wallpaper/ui" }
nova-workspaces-ui = { path = "../features/workspaces/ui" }

# The daemon side's crates the UI side may use, by path: api and -info crates.
nova-ai-usage-api = { path = "../features/ai-usage/api" }
nova-app-info = { path = "../framework/app-info" }
nova-carrier = { path = "../framework/carrier" }
nova-bar-api = { path = "../features/bar/api" }
nova-bluetooth-api = { path = "../features/bluetooth/api" }
nova-daemon-info = { path = "../framework/daemon-info" }
nova-desktop-info = { path = "../framework/desktop-info" }
nova-host-info = { path = "../framework/host-info" }
nova-launcher-api = { path = "../features/launcher/api" }
nova-lock-api = { path = "../features/lock/api" }
nova-media-api = { path = "../features/media/api" }
nova-network-api = { path = "../features/network/api" }
nova-nova-files-api = { path = "../features/nova-files/api" }
nova-notifications-api = { path = "../features/notifications/api" }
nova-peripherals-api = { path = "../features/peripherals/api" }
nova-power-api = { path = "../features/power/api" }
nova-recording-api = { path = "../features/recording/api" }
nova-resources-api = { path = "../features/resources/api" }
nova-screenshot-api = { path = "../features/screenshot/api" }
nova-sound-api = { path = "../features/sound/api" }
nova-test-support = { path = "../framework/test-support" }
nova-theme-info = { path = "../framework/theme-info" }
nova-tray-api = { path = "../features/tray/api" }
nova-volume-osd-api = { path = "../features/volume-osd/api" }
nova-wallpaper-api = { path = "../features/wallpaper/api" }
nova-workspaces-api = { path = "../features/workspaces/api" }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Restriction picks, the same as Nova Files' (AGENTS.md, Rules and their
# checks). clippy.toml exempts tests where noted there.
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
too_many_lines = "deny"

# The checks build like dev but without debug info, which swells target/
# and the link (Nova Files' profile of the same name).
[profile.ci]
inherits = "dev"
debug = false
incremental = false
