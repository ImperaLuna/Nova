name: CI

# Runs on a self-hosted NixOS runner (ImperaLuna's desktop) while Nova is
# young, so rapid pushes cost no GitHub minutes. To move back to GitHub's
# runners: set `runs-on: ubuntu-latest` and add
# `- uses: cachix/install-nix-action@v31` after checkout.
on:
  pull_request:
  workflow_dispatch:

# A newer push to the same PR cancels the run for the older one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks
    runs-on: [self-hosted, nova]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: nix flake check
        run: nix flake check -L
      - name: headless e2e
        run: nix develop -c just e2e
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e
          path: e2e/out
          if-no-files-found: ignore
