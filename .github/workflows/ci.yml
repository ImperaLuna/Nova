name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    name: nix flake check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - run: nix flake check -L

  e2e:
    name: headless e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - run: nix develop -c just e2e
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e
          path: e2e/out
