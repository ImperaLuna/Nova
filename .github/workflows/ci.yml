name: CI

# Runs on a self-hosted NixOS runner (ImperaLuna's desktop) while Nova is
# young, so rapid pushes cost no GitHub minutes. To move back to GitHub's
# runners: set `runs-on: ubuntu-latest` and add
# `- uses: cachix/install-nix-action@v31` after checkout.
on:
  pull_request:
  workflow_dispatch:

# PR code runs here; it gets a token that can only read.
permissions:
  contents: read

# A newer run for the same branch cancels the older one. Keyed by branch, not
# ref, so a PR run and a run started by hand on the same branch don't both
# take the runner.
concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks
    runs-on: [self-hosted, nova]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: nix flake check
        run: nix flake check -L --keep-going
      # The headless e2e's logs and screenshot, and the VM tests' screenshots,
      # report and odiff diffs. The flake check already built them, also when
      # it failed on them; --max-jobs 0 skips building them again when a
      # test itself failed.
      - name: e2e results
        if: always()
        run: |
          mkdir -p e2e/out
          checks=.#checks.x86_64-linux
          if out=$(nix build --max-jobs 0 --no-link --print-out-paths "$checks.e2e-headless.run"); then
            cp -r --no-preserve=mode "$out/." e2e/out/
            # Its memory warning, as an annotation.
            grep '^::warning' e2e/out/e2e.log || true
          fi
          for compositor in niri hyprland; do
            shots=$(nix build --max-jobs 0 --no-link --print-out-paths "$checks.e2e-$compositor.compare") &&
              cp -r --no-preserve=mode "$shots" "e2e/out/vm-$compositor" || true
          done
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e
          path: e2e/out
          if-no-files-found: ignore
