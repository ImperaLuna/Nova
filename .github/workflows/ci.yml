name: CI

# Runs on a self-hosted NixOS runner (ImperaLuna's desktop) while Nova is
# young, so rapid pushes cost no GitHub minutes. To move back to GitHub's
# runners: set `runs-on: ubuntu-latest` and add
# `- uses: cachix/install-nix-action@v31` after checkout.
#
# Two jobs, behind the one `checks` status the ruleset and the merge lane
# (scripts/update-prs.sh) read:
#   - fast: every flake check but the VM tests (build, cargo tests, lints,
#     QML tests, headless e2e), on every push, so a draft hears back in a
#     couple of minutes.
#   - vm: the NixOS VM tests on niri and Hyprland, only on PRs that aren't
#     drafts (and when a draft is marked ready), in parallel with fast.
# A draft's `checks` passes without the VM tests; marking it ready runs them
# (IMP-228).
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

# PR code runs here; it gets a token that can only read.
permissions:
  contents: read

# A newer run for the same branch cancels the older one. Keyed by branch, not
# ref, so a PR run and a run started by hand on the same branch don't both
# take the runner.
concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  fast:
    name: fast checks
    runs-on: [self-hosted, nova]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # What `nix flake check` evaluates (outputs, modules), without building.
      - name: nix flake check --no-build
        run: nix flake check --no-build
      - name: flake checks but the VM tests
        run: |
          checks=.#checks.x86_64-linux
          names=$(nix eval --raw "$checks" --apply 'c: builtins.concatStringsSep " " (builtins.filter (n: n != "e2e-niri" && n != "e2e-hyprland") (builtins.attrNames c))')
          targets=()
          for name in $names; do targets+=("$checks.$name"); done
          nix build -L --no-link --keep-going "${targets[@]}"
      # The headless e2e's logs and screenshot. --max-jobs 0 skips building
      # it again when the test itself failed.
      - name: e2e results
        if: always()
        run: |
          mkdir -p e2e/out
          if out=$(nix build --max-jobs 0 --no-link --print-out-paths .#checks.x86_64-linux.e2e-headless.run); then
            cp -r --no-preserve=mode "$out/." e2e/out/
            # Its memory warning, as an annotation.
            grep '^::warning' e2e/out/e2e.log || true
          fi
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-headless
          path: e2e/out
          if-no-files-found: ignore

  vm:
    name: VM tests
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: [self-hosted, nova]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: VM tests on niri and Hyprland
        run: nix build -L --no-link --keep-going .#checks.x86_64-linux.e2e-niri .#checks.x86_64-linux.e2e-hyprland
      # The VM tests' screenshots, report and odiff diffs. The step above
      # already built them, also when it failed on them; --max-jobs 0 skips
      # building them again when a test itself failed.
      - name: e2e results
        if: always()
        run: |
          mkdir -p e2e/out
          for compositor in niri hyprland; do
            shots=$(nix build --max-jobs 0 --no-link --print-out-paths ".#checks.x86_64-linux.e2e-$compositor.compare") &&
              cp -r --no-preserve=mode "$shots" "e2e/out/vm-$compositor" || true
          done
      # Each state's Pss (frames.py) against main's, in the job summary.
      # Main's VM run is normally in the store already, from the PR that
      # became it (same tree, so the same build); --max-jobs 0 skips the
      # comparison rather than running main's VM test here.
      - name: Check out main for the Pss comparison
        if: always() && github.event_name == 'pull_request'
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .pss-main
          persist-credentials: false
      - name: Pss against main
        if: always() && github.event_name == 'pull_request'
        run: |
          for compositor in niri hyprland; do
            frames=checks.x86_64-linux.e2e-$compositor.frames
            pr=$(nix build --max-jobs 0 --no-link --print-out-paths ".#$frames") || continue
            if ! main=$(nix build --max-jobs 0 --no-link --print-out-paths "./.pss-main#$frames"); then
              echo "Main's Pss on $compositor isn't on this runner; no comparison." >>"$GITHUB_STEP_SUMMARY"
              continue
            fi
            # The table to the summary, warnings to the log as annotations.
            # The runner has no awk of its own.
            nix shell --inputs-from . nixpkgs#gawk -c \
              bash e2e/vm/pss-compare.sh "$compositor" "$main/pss.txt" "$pr/pss.txt" 2>&1 >>"$GITHUB_STEP_SUMMARY"
          done
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e
          path: e2e/out
          if-no-files-found: ignore

  # The status the ruleset requires. Green when fast passed and the VM tests
  # passed, or were skipped on a draft.
  checks:
    name: checks
    needs: [fast, vm]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: fast and VM results
        env:
          FAST: ${{ needs.fast.result }}
          VM: ${{ needs.vm.result }}
          DRAFT: ${{ github.event.pull_request.draft == true }}
        run: |
          echo "fast checks: $FAST, VM tests: $VM"
          [[ $FAST == success ]] || exit 1
          [[ $VM == success ]] && exit 0
          if [[ $VM == skipped && $DRAFT == true ]]; then
            echo "::notice::Draft PR: VM tests run once it's marked ready."
            exit 0
          fi
          exit 1
