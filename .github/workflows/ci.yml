name: CI

# Runs on a self-hosted NixOS runner (ImperaLuna's desktop) while Nova is
# young, so rapid pushes cost no GitHub minutes. To move back to GitHub's
# runners: set `runs-on: ubuntu-latest` and add
# `- uses: cachix/install-nix-action@v31` after checkout.
on:
  pull_request:
  workflow_dispatch:

# PR code runs here; it gets a token that can only read.
permissions:
  contents: read

# A newer run for the same branch cancels the older one. Keyed by branch, not
# ref, so a PR run and a dispatched run on the same branch (Update PRs
# dispatches CI after its merge, and GitHub also offers an "Approve and run"
# for the bot's push) don't both take the runner.
concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks
    runs-on: [self-hosted, nova]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: nix flake check
        run: nix flake check -L
      - name: headless e2e
        run: nix develop -c just e2e
      # The VM tests' screenshots, report and odiff diffs. The flake check
      # already built them, also when it failed on a diff; --max-jobs 0
      # skips building them again when the VM test itself failed.
      - name: VM screenshots
        if: always()
        run: |
          # The headless e2e makes e2e/out, but it's skipped when the flake check fails.
          mkdir -p e2e/out
          for compositor in niri hyprland; do
            shots=$(nix build --max-jobs 0 --no-link --print-out-paths ".#checks.x86_64-linux.e2e-$compositor.compare") &&
              cp -r --no-preserve=mode "$shots" "e2e/out/vm-$compositor" || true
          done
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e
          path: e2e/out
          if-no-files-found: ignore
