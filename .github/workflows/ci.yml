name: CI

# Runs on a self-hosted NixOS runner (ImperaLuna's desktop) while Nova is
# young, so rapid pushes cost no GitHub minutes. To move back to GitHub's
# runners: set `runs-on: ubuntu-latest` and add
# `- uses: cachix/install-nix-action@v31` after checkout.
#
# Two jobs, behind the one `checks` status the ruleset and the merge lane
# (scripts/update-prs.sh) read:
#   - fast: every flake check but the VM tests (build, cargo tests, lints,
#     QML tests, headless e2e), on every push, so a draft hears back in a
#     couple of minutes.
#   - vm: the NixOS VM tests on niri and Hyprland, only on PRs that aren't
#     drafts (and when a draft is marked ready), in parallel with fast.
# A draft's `checks` passes without the VM tests; marking it ready runs them
# (IMP-228). So does a PR with another PR stacked on it: the stack's top PR
# holds every commit below it, so its VM run covers the whole stack (IMP-326).
#
# A PR that changes only the UI side's crates (app-ui/, framework-ui/,
# features/<id>/ui/: the GPUI port, which has no UI test suite) skips the VM
# tests and the QML checks, which run the Quickshell UI it can't touch
# (IMP-393). The flake keeps those crates out of every daemon build, so the
# daemon's other checks come from the store.
#
# `closed` starts a run with every job skipped, only so the concurrency group
# below cancels the branch's queued or running run once its PR merges or
# closes, rather than spend a runner on code that has landed (IMP-326).
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, closed]
  workflow_dispatch:

# PR code runs here; it gets a token that can only read.
permissions:
  contents: read

# A newer run for the same branch cancels the older one. Keyed by branch, not
# ref, so a PR run and a run started by hand on the same branch don't both
# take the runner.
concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  fast:
    name: fast checks
    needs: shape
    if: github.event.action != 'closed'
    runs-on: [self-hosted, nova]
    timeout-minutes: 30
    env:
      UI_ONLY: ${{ needs.shape.outputs.ui_only }}
      # Never in this job: the VM tests.
      VM_CHECKS: e2e-niri e2e-hyprland
      # The checks that run or read the Quickshell UI, skipped on a PR that
      # changes only the UI side's crates.
      QML_CHECKS: qmllint qmlformat qml-tests shaders e2e-headless quickshell-version
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # What `nix flake check` evaluates (outputs, modules), without building.
      - name: nix flake check --no-build
        run: nix flake check --no-build
      - name: flake checks but the VM tests
        run: |
          checks=.#checks.x86_64-linux
          skipped=" $VM_CHECKS "
          if [[ $UI_ONLY == true ]]; then
            echo "::notice::Only UI crates changed: skipping the QML checks ($QML_CHECKS)."
            skipped+="$QML_CHECKS "
          fi
          names=$(nix eval --raw "$checks" --apply 'c: builtins.concatStringsSep " " (builtins.attrNames c)')
          targets=()
          for name in $names; do
            [[ $skipped == *" $name "* ]] || targets+=("$checks.$name")
          done
          nix build -L --no-link --keep-going "${targets[@]}"
      # The headless e2e's logs and screenshot. --max-jobs 0 skips building
      # it again when the test itself failed.
      - name: e2e results
        if: always() && env.UI_ONLY != 'true'
        run: |
          mkdir -p e2e/out
          if out=$(nix build --max-jobs 0 --no-link --print-out-paths .#checks.x86_64-linux.e2e-headless.run); then
            cp -r --no-preserve=mode "$out/." e2e/out/
            # Its memory warning, as an annotation.
            grep '^::warning' e2e/out/e2e.log || true
          fi
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-headless
          path: e2e/out
          if-no-files-found: ignore

  # What the PR is, for the jobs that depend on it: how many open PRs are
  # stacked on it (use its branch as their base), and whether it changes
  # only the UI side's crates. On GitHub's runners, so it never waits behind
  # the self-hosted queue.
  shape:
    name: PR shape
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      above: ${{ steps.count.outputs.above }}
      ui_only: ${{ steps.files.outputs.ui_only }}
    steps:
      - id: count
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
          # Empty on a run started by hand.
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          # A fork's branch name means nothing here (a fork's `main` would
          # count every PR into main): a fork PR is never under a stack.
          if [[ -n $HEAD_REPO && $HEAD_REPO != "$GITHUB_REPOSITORY" ]]; then
            above=0
          else
            above=$(gh api "repos/$GITHUB_REPOSITORY/pulls?state=open&base=$BRANCH" --jq length)
          fi
          echo "PRs stacked on $BRANCH: $above"
          echo "above=$above" >>"$GITHUB_OUTPUT"
      # Every file the PR changes against its base, a renamed file under
      # both names: the whole PR, not its last push. Anything outside the
      # UI crates' folders (the flake, CI, a script, a daemon crate) makes
      # it an ordinary PR. From the API, so nothing the PR's code does can
      # change the answer. A run started by hand tests everything.
      - id: files
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          UI_FOLDERS: ^(app-ui|framework-ui|features/[^/]+/ui)/
        run: |
          ui_only=false
          if [[ -n $PR ]]; then
            files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" \
              --jq '.[] | .filename, (.previous_filename // empty)')
            if [[ -n $files ]] && ! grep -qvE "$UI_FOLDERS" <<<"$files"; then
              ui_only=true
            fi
          fi
          echo "Only UI crates changed: $ui_only"
          echo "ui_only=$ui_only" >>"$GITHUB_OUTPUT"

  vm:
    name: VM tests
    needs: shape
    # Not on a draft, not under another PR of a stack, and not when only UI
    # crates changed; a run started by hand always tests.
    if: >-
      github.event_name != 'pull_request' ||
      (!github.event.pull_request.draft && needs.shape.outputs.above == '0' &&
      needs.shape.outputs.ui_only != 'true')
    runs-on: [self-hosted, nova]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: VM tests on niri and Hyprland
        run: nix build -L --no-link --keep-going .#checks.x86_64-linux.e2e-niri .#checks.x86_64-linux.e2e-hyprland
      # The VM tests' screenshots, report and odiff diffs. The step above
      # already built them, also when it failed on them; --max-jobs 0 skips
      # building them again when a test itself failed.
      - name: e2e results
        if: always()
        run: |
          mkdir -p e2e/out
          for compositor in niri hyprland; do
            shots=$(nix build --max-jobs 0 --no-link --print-out-paths ".#checks.x86_64-linux.e2e-$compositor.compare") &&
              cp -r --no-preserve=mode "$shots" "e2e/out/vm-$compositor" || true
          done
      # Each state's Pss (frames.py) against main's, in the job summary.
      # Main's VM run is normally in the store already, from the PR that
      # became it (same tree, so the same build); --max-jobs 0 skips the
      # comparison rather than running main's VM test here.
      - name: Check out main for the Pss comparison
        if: always() && github.event_name == 'pull_request'
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .pss-main
          persist-credentials: false
      - name: Pss against main
        if: always() && github.event_name == 'pull_request'
        run: |
          for compositor in niri hyprland; do
            frames=checks.x86_64-linux.e2e-$compositor.frames
            pr=$(nix build --max-jobs 0 --no-link --print-out-paths ".#$frames") || continue
            if ! main=$(nix build --max-jobs 0 --no-link --print-out-paths "./.pss-main#$frames"); then
              echo "Main's Pss on $compositor isn't on this runner; no comparison." >>"$GITHUB_STEP_SUMMARY"
              continue
            fi
            # The table to the summary, warnings to the log as annotations.
            # The runner has no awk of its own.
            nix shell --inputs-from . nixpkgs#gawk -c \
              bash e2e/vm/pss-compare.sh "$compositor" "$main/pss.txt" "$pr/pss.txt" 2>&1 >>"$GITHUB_STEP_SUMMARY"
          done
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e
          path: e2e/out
          if-no-files-found: ignore

  # The status the ruleset requires. Green when fast passed and the VM tests
  # passed, or were skipped on a draft, under a stacked PR or on a PR that
  # changes only UI crates.
  checks:
    name: checks
    needs: [fast, shape, vm]
    # Not on a run a newer push cancelled (that head no longer matters), nor
    # on a closed PR.
    if: ${{ !cancelled() && github.event.action != 'closed' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: fast and VM results
        env:
          FAST: ${{ needs.fast.result }}
          VM: ${{ needs.vm.result }}
          DRAFT: ${{ github.event.pull_request.draft == true }}
          SHAPE: ${{ needs.shape.result }}
          ABOVE: ${{ needs.shape.outputs.above }}
          UI_ONLY: ${{ needs.shape.outputs.ui_only }}
        run: |
          echo "fast checks: $FAST, VM tests: $VM, PRs stacked on this one: $ABOVE"
          [[ $FAST == success ]] || exit 1
          [[ $VM == success ]] && exit 0
          [[ $VM == skipped ]] || exit 1
          if [[ $DRAFT == true ]]; then
            echo "::notice::Draft PR: VM tests run once it's marked ready."
            exit 0
          fi
          if [[ $SHAPE == success && $ABOVE != 0 ]]; then
            echo "::notice::$ABOVE PR(s) stacked on this one: the VM tests run on the stack's top PR."
            exit 0
          fi
          if [[ $SHAPE == success && $UI_ONLY == true ]]; then
            echo "::notice::Only UI crates changed: the VM tests don't cover them."
            exit 0
          fi
          exit 1
