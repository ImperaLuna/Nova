name: CI

# Runs on GitHub's runners, so it needs no machine of ours and a pull request
# from a fork can't touch one.
#
# One job, `fast`, runs every flake check (build, cargo tests, lints) on
# every push. `checks`, the status the ruleset and the merge lane
# (scripts/update-prs.sh) read, passes when it does. The flake keeps the UI
# side's crates out of every daemon build, so a UI-only PR gets the daemon's
# checks from the store.
#
# The Nix store comes from the GitHub Actions cache, keyed by the files the
# dependency builds come from (GPUI alone is some seven hundred crates). A
# run that misses its key restores the newest store, builds what changed and
# saves the result. A pull request can read only its own caches and main's,
# so a push to main runs too, only to fill main's cache: when the key is
# already there it stops in under a minute without building.
#
# `closed` starts a run with every job skipped, only so the concurrency group
# below cancels the branch's queued or running run once its PR merges or
# closes, rather than spend a runner on code that has landed (IMP-326).
on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  push:
    branches: [main]
  workflow_dispatch:

# PR code runs here; it gets a token that can only read.
permissions:
  contents: read

# A newer run for the same branch cancels the older one. Keyed by branch, not
# ref, so a PR run and a run started by hand on the same branch don't both
# run. Main's cache run has a group of its own, which a fork's PR from its
# own `main` can't share, and it finishes, so the cache it fills is saved.
concurrency:
  group: ci-${{ github.event_name == 'push' && 'cache-' || '' }}${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  fast:
    name: fast checks
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    # A run with no cache to start from builds every dependency.
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The files the dependency builds come from: a change to any other
      # file rebuilds only Nova's own crates.
      - name: cache key
        id: key
        run: echo "key=nix-${{ hashFiles('flake.lock', '**/Cargo.lock', '**/Cargo.toml', '**/.cargo/config.toml', '**/*.nix') }}" >>"$GITHUB_OUTPUT"
      # The store and the build outgrow the runner's free space; these are
      # toolchains Nova never uses.
      - name: free disk space in the background
        run: nohup sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL >/dev/null 2>&1 &
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
        with:
          # Keep what the checks were built from (compilers, compiled
          # dependencies) through the garbage collection before a save.
          extra_nix_config: |
            keep-outputs = true
            keep-derivations = true
      # On main the run only fills the cache: nothing to do when it is there.
      - name: look for main's cache
        id: probe
        if: github.event_name == 'push'
        uses: nix-community/cache-nix-action/restore@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: ${{ steps.key.outputs.key }}
          lookup-only: true
      - name: restore the Nix store
        id: cache
        if: steps.probe.outputs.hit-primary-key != 'true'
        uses: nix-community/cache-nix-action/restore@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: ${{ steps.key.outputs.key }}
          restore-prefixes-first-match: nix-
      # What `nix flake check` evaluates (outputs, modules), without building.
      - name: nix flake check --no-build
        if: steps.probe.outputs.hit-primary-key != 'true'
        run: nix flake check --no-build
      - name: flake checks
        if: steps.probe.outputs.hit-primary-key != 'true'
        run: |
          checks=.#checks.x86_64-linux
          names=$(nix eval --raw "$checks" --apply 'c: builtins.concatStringsSep " " (builtins.attrNames c)')
          targets=()
          for name in $names; do
            targets+=("$checks.$name")
          done
          # The links are the garbage collection's roots.
          nix build -L --out-link "$RUNNER_TEMP/checks/result" --keep-going "${targets[@]}"
      # Only what these checks used goes into the cache, not what an older
      # store brought along.
      - name: drop what the checks didn't use
        if: steps.cache.outputs.hit-primary-key == 'false'
        run: nix store gc
      - name: save the Nix store
        if: steps.cache.outputs.hit-primary-key == 'false'
        uses: nix-community/cache-nix-action/save@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: ${{ steps.key.outputs.key }}

  # The status the ruleset requires: green when the fast checks passed.
  checks:
    name: checks
    needs: [fast]
    # Not on a run a newer push cancelled (that head no longer matters), nor
    # on a closed PR, nor on main's cache run.
    if: ${{ !cancelled() && github.event.action != 'closed' && github.event_name != 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: fast checks result
        env:
          FAST: ${{ needs.fast.result }}
        run: |
          echo "fast checks: $FAST"
          [[ $FAST == success ]]
