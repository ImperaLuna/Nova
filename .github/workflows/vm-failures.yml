name: VM failures

# After a CI run fails, lists each VM subtest that failed in it in the
# "VM test failures" issue, one row per subtest, so a flaky one shows as a
# repeat without anyone searching old runs. When one already failed on
# another PR, it says so on this PR (scripts/vm-failures.sh).
#
# Runs no PR code (workflow_run runs main's workflow and script), on a
# GitHub-hosted machine, so it doesn't queue behind CI on the self-hosted
# runner. Each attempt of a CI run is its own workflow_run, so a re-run that
# fails again is listed too.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read

# One at a time, so two runs never edit the issue's body together.
concurrency:
  group: vm-failures
  cancel-in-progress: false

jobs:
  record:
    name: record failed VM subtests
    if: github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # The failed jobs' logs.
      actions: read
      # The tracking issue, and the comment on a PR.
      issues: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      RUN_ID: ${{ github.event.workflow_run.id }}
      RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
      RUN_DATE: ${{ github.event.workflow_run.run_started_at }}
      PR: ${{ github.event.workflow_run.pull_requests[0].number }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: record
        run: scripts/vm-failures.sh record
