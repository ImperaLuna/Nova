name: Update PRs

# Keeps open PRs mergeable without re-running every PR's CI each time main
# moves (scripts/update-prs.sh):
#   - on a push to main, the conflict probe tries main's merge into every
#     open PR in memory and comments on the ones that conflict. It pushes
#     nothing, so no CI starts.
#   - the merge lane merges main into one armed PR at a time (auto-merge on,
#     no `hold` label), oldest first. GitHub merges it once `checks` passes
#     on top of the current main, which moves main and runs the lane again.
#     It also runs when a PR is armed or loses a label, and after each CI run,
#     so it moves on as soon as the PR in the lane passes or fails.
#
# The lane pushes with the PUSH_TOKEN secret, never GITHUB_TOKEN: GitHub
# doesn't count a CI run started by github-actions[bot] for the `checks` rule,
# and holds its pull_request run for approval.
#
# Runs no PR code (pull_request_target and workflow_run run main's workflow
# and script), on a GitHub-hosted machine, so it doesn't queue behind CI on
# the self-hosted runner.
on:
  push:
    branches: [main]
  pull_request_target:
    types: [auto_merge_enabled, unlabeled]
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

# One at a time, so two runs never pick the lane's next PR together. A
# queued run is replaced by a newer one; the running one finishes.
concurrency:
  group: update-prs
  cancel-in-progress: false

jobs:
  update:
    name: conflict probe and merge lane
    # Only CI runs on PRs can move the lane.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      TOKEN: ${{ secrets.PUSH_TOKEN }}
      BASE: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - name: check the push token
        run: |
          if [[ -z $TOKEN ]]; then
            echo "::error::the PUSH_TOKEN secret is missing: add a fine-grained token with Contents and Workflows write on this repo, under Settings > Secrets and variables > Actions"
            exit 1
          fi
      - name: conflict probe
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: scripts/update-prs.sh probe
      - name: merge lane
        run: scripts/update-prs.sh lane
