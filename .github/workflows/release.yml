name: Release

# Pushing a tag vX.Y.Z (the workspace version in Cargo.toml) builds the
# release archive install.sh fetches, nova-<cpu>-linux.tar.gz and its
# .sha256 (`nix build .#dist`), and publishes them as that tag's GitHub
# release. x86_64 only: the runner is x86_64, and install.sh builds from
# source where there's no archive.
#
# Runs on a fresh machine of GitHub's, never one that ran a PR branch's code:
# anything a branch left behind there (a git hook in the workspace, say)
# would run here with a token that can replace the archive.
on:
  push:
    tags: ["v*"]

# Only the release upload writes; the tag push already needed write access.
permissions:
  contents: write

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
      - name: Tag matches the version
        run: |
          version=$(nix eval --raw .#nova.version)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match Cargo.toml's version $version." >&2
            exit 1
          fi
      - name: Build the archive
        run: nix build -L .#dist
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          nix shell --inputs-from . nixpkgs#gh -c \
            gh release create "$GITHUB_REF_NAME" result/* --verify-tag --generate-notes
