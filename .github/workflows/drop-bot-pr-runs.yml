name: Drop bot PR runs

# A push made with GITHUB_TOKEN also gets a pull_request CI run that waits for
# "Approve and run" (GitHub, since June 2026), which shows as "1 workflow
# awaiting approval" on the PR. The workflows that push as the bot start CI
# themselves with a dispatch, which needs no approval and reports `checks`,
# so that waiting run is a duplicate: this deletes it. Called by Update PRs,
# Approve goldens and Bump advisory-db after they push.
on:
  workflow_call:
    inputs:
      shas:
        description: The commits the bot pushed, space-separated
        required: true
        type: string

permissions: {}

jobs:
  drop:
    name: drop waiting bot runs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: delete the runs awaiting approval
        env:
          GH_TOKEN: ${{ github.token }}
          SHAS: ${{ inputs.shas }}
        run: |
          for sha in $SHAS; do
            # The run shows up a few seconds after the push.
            for _ in $(seq 12); do
              ids=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$sha&event=pull_request&status=action_required" \
                --jq '.workflow_runs[] | select(.actor.login == "github-actions[bot]") | .id')
              [[ -n $ids ]] && break
              sleep 5
            done
            for id in $ids; do
              echo "Deleting run $id on $sha."
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/runs/$id"
            done
          done
