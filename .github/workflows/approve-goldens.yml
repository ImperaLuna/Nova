name: Approve goldens

# Runs the VM tests on the self-hosted runner, where they get KVM, and commits
# their screenshots to `branch` as the new e2e/golden/<compositor> images. For
# an intended visual change, so sessions without KVM don't have to run the VM
# tests themselves. Start it from main (the workflow then comes from main, not
# from the branch): Actions > Approve goldens, or the API with ref main.
#
# It approves whatever the VM run captured, so use it only for a change you
# meant to make; a test that failed by accident needs fixing, not approving.
#
# Two jobs: `screenshots` runs the branch's code with a read-only token and
# hands the images over as an artifact; `commit` holds the write token and
# runs no branch code, on a fresh GitHub-hosted machine. Pushes made with
# GITHUB_TOKEN don't start other workflows, so `commit` then starts CI on the
# branch itself.
on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to commit the goldens to (a PR branch, never main)
        required: true
        type: string
      compositors:
        description: Which VM tests to approve, space-separated
        default: niri hyprland
        type: string

concurrency:
  group: approve-goldens-${{ inputs.branch }}

permissions:
  contents: read

jobs:
  screenshots:
    name: VM screenshots
    runs-on: [self-hosted, nova]
    timeout-minutes: 45
    steps:
      - name: check branch
        env:
          BRANCH: ${{ inputs.branch }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [[ $BRANCH == "$DEFAULT_BRANCH" ]]; then
            echo "::error::goldens change through a PR, not on $DEFAULT_BRANCH"
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.branch }}
          persist-credentials: false
      # Usually cached: CI on the PR already built the same VM tests.
      - name: just e2e-approve
        env:
          COMPOSITORS: ${{ inputs.compositors }}
        run: |
          for compositor in $COMPOSITORS; do
            nix develop -c just e2e-approve "$compositor"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: goldens
          path: e2e/golden
          if-no-files-found: error

  commit:
    name: commit goldens
    needs: screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.branch }}
          persist-credentials: false
      - uses: actions/download-artifact@v7
        with:
          name: goldens
          path: e2e/golden
      - name: commit and push
        id: push
        env:
          BRANCH: ${{ inputs.branch }}
          TOKEN: ${{ github.token }}
        run: |
          # Only the images, whatever else the artifact holds.
          git add -- 'e2e/golden/*/*.png'
          if git diff --cached --quiet; then
            echo "Goldens already match the screenshots; nothing to commit."
            echo "pushed=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --cached --stat
          git -c core.hooksPath=/dev/null -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -q -m "Approve VM goldens" -m "From the VM tests on the KVM runner (run ${{ github.run_id }})."
          auth=$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)
          git -c core.hooksPath=/dev/null -c http.extraheader="AUTHORIZATION: basic $auth" \
            push origin "HEAD:refs/heads/$BRANCH"
          echo "pushed=true" >>"$GITHUB_OUTPUT"
      - name: start CI on the new commit
        if: steps.push.outputs.pushed == 'true'
        env:
          BRANCH: ${{ inputs.branch }}
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$BRANCH"
