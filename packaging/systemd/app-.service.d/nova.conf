# Installed beside nova.service as app-.service.d/nova.conf: a drop-in for
# every `app-*.service`, which includes the units systemd makes for XDG
# autostart entries (`app-<name>@autostart.service`). They start once novad
# is ready (Type=notify), so tray apps find Nova's tray. The order only counts
# while nova.service starts too; an app started later doesn't wait.
[Unit]
After=nova.service
