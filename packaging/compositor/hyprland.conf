# Nova's Hyprland rules, written by `nova setup` to ~/.config/nova/hyprland.conf
# (or linked there by the home-manager module) and sourced from Hyprland's
# config. A flake check runs `Hyprland --verify-config` on it. Hyprland
# blurs what Quickshell asks for without a rule.

# Nova Files draws square edges and leaves rounding to the compositor, like
# any app; this is the radius it suggests (packaging/compositor/niri.kdl
# suggests the same, and the blur Nova Files asks for is rounded to it:
# Tokens.filesWindowRadius). Your own rule for it, after this source line, wins.
windowrule = match:class ^(nova-files(-picker)?)$, rounding 16

# Apps' Open and Save dialogs (Nova Files in picker mode, its own app id)
# float in the middle of the screen at the size Nova Files asks for, like
# any dialog; Nova Files' own windows tile. A dialog has no parent window,
# so without this it would tile, and a tiled window opening under a
# fullscreen one gives the focus back to it, hiding the dialog. A focused
# floating window shows over a fullscreen one.
windowrule = match:class ^(nova-files-picker)$, float on
windowrule = match:class ^(nova-files-picker)$, center on
