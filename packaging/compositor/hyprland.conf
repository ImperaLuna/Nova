# Nova's Hyprland rules, written by `nova setup` to ~/.config/nova/hyprland.conf
# (or linked there by the home-manager module) and sourced from Hyprland's
# config. For Hyprland's old config format (0.56 and older); hyprland.lua
# beside this file says the same for a Lua config (all of 0.57). A flake
# check runs `Hyprland --verify-config` on it. Hyprland blurs what Quickshell
# asks for without a rule, so there are no blur rules.

misc {
    # Hyprland refuses a new lock screen after the one holding the lock
    # stopped, so a lock screen that crashes or restarts leaves the session
    # locked with nothing to type into. With this, novad's restarted UI
    # locks again.
    allow_session_lock_restore = true
}
