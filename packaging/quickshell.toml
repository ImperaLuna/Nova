# The Quickshell releases Nova is tested with: the one source of truth for the
# flake (a check fails when nixpkgs' Quickshell leaves the range), novad (it
# warns at start), `nova status` and `nova doctor`; later `nova setup`.
#
# `min` is the oldest tested release, `max` the newest. An `x` in `max`
# matches any number there, so "0.3.x" takes every 0.3 patch release.
# Raise `max` once Nova has been tested on a newer release: the "Newest
# Quickshell" workflow (scripts/newest-quickshell.sh) builds Nova and runs its
# qmllint on the newest one and says when it passes outside this range.
#
# `[packages]` is what `nova setup` installs on other distros while any
# feature with a UI is on (Nix's flake brings Quickshell itself). Fedora's
# comes from a COPR until it reaches a release, which `nova setup` enables.
min = "0.3.2"
max = "0.3.x"

[packages]
arch = ["quickshell"]
fedora = ["quickshell"]
debian = ["quickshell"]
