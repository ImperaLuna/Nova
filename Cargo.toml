[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
insta = "1"
clap = { version = "4", features = ["derive"] }
jiff = "0.2"
libc = "0.2"
ureq = { version = "3", default-features = false, features = ["rustls"] }
nova-protocol = { path = "crates/nova-protocol" }
nova-features = { path = "crates/nova-features" }
nova-paths = { path = "crates/nova-paths" }
nova-quickshell = { path = "crates/nova-quickshell" }
novad = { path = "crates/novad" }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
