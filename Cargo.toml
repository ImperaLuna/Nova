[workspace]
resolver = "3"
members = ["crates/*", "framework/*", "features/*/api", "features/*/core"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.88"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
insta = "1"
proptest = { version = "1", default-features = false, features = ["std"] }
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
shlex = "2"
jiff = "0.2"
libc = "0.2"
ureq = { version = "3", default-features = false, features = ["rustls"] }
# logind over the system bus (power menu, lock screen). Blocking calls; async-io runs its connection.
zbus = { version = "6", default-features = false, features = ["default-rt", "service"] }
# Reading zbus's signal streams without an async runtime's helpers.
futures-core = { version = "0.3", default-features = false }
# Cropping and writing screenshots (pure Rust, so the static musl build stays).
png = "0.18"
# Telling an image from another file before awww gets it (headers only, no dependencies).
imagesize = "0.15"
# Decrypting the Claude desktop app's sign-in (Chromium's OS crypt), pure Rust for the static musl build.
aes = "0.9"
cbc = { version = "0.2", features = ["alloc", "block-padding"] }
pbkdf2 = { version = "0.13", default-features = false, features = ["hmac"] }
sha1 = { version = "0.11", default-features = false }
# Names in the shared freedesktop thumbnail cache (the MD5 of a file's URI), pure Rust.
md-5 = { version = "0.11", default-features = false }
base64 = "0.23"
# Nova Files' archives (IMP-323), pure Rust for the static musl build: zip, tar, deflate and gzip
# through flate2's miniz_oxide (png's already), zstd decoding through ruzstd, xz through lzma-rust2.
zip = { version = "9", default-features = false, features = ["deflate-flate2", "deflate64", "lzma", "xz", "jiff-02"] }
tar = { version = "0.4", default-features = false }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
ruzstd = "0.9"
lzma-rust2 = { version = "0.23", default-features = false, features = ["std", "xz"] }
nova-protocol = { path = "crates/nova-protocol" }
nova-features = { path = "crates/nova-features" }
nova-quickshell = { path = "crates/nova-quickshell" }
novad = { path = "crates/novad" }
nova-base = { path = "framework/base" }
nova-carrier = { path = "framework/carrier" }
nova-hub = { path = "framework/hub" }
nova-log = { path = "framework/log" }
nova-modules = { path = "framework/modules" }
nova-watch = { path = "framework/watch" }
nova-icons = { path = "framework/icons" }
nova-inotify = { path = "framework/inotify" }
nova-paths = { path = "framework/paths" }
nova-process = { path = "framework/process" }
nova-session-bus = { path = "framework/session-bus" }
nova-settings = { path = "framework/settings" }
nova-socket = { path = "framework/socket" }
nova-mime = { path = "framework/mime" }
nova-apps = { path = "framework/apps" }
nova-theme = { path = "framework/theme" }
nova-host = { path = "framework/host" }
nova-compositor = { path = "framework/compositor" }
nova-test-support = { path = "framework/test-support" }
nova-bluetooth-api = { path = "features/bluetooth/api" }
nova-bluetooth = { path = "features/bluetooth/core" }
nova-launcher-api = { path = "features/launcher/api" }
nova-launcher = { path = "features/launcher/core" }
nova-media-api = { path = "features/media/api" }
nova-media = { path = "features/media/core" }
nova-network-api = { path = "features/network/api" }
nova-network = { path = "features/network/core" }
nova-notifications-api = { path = "features/notifications/api" }
nova-notifications = { path = "features/notifications/core" }
nova-peripherals-api = { path = "features/peripherals/api" }
nova-resources-api = { path = "features/resources/api" }
nova-resources = { path = "features/resources/core" }
nova-tray-api = { path = "features/tray/api" }
nova-tray = { path = "features/tray/core" }
nova-wallpaper-api = { path = "features/wallpaper/api" }
nova-wallpaper = { path = "features/wallpaper/core" }
nova-x11-tray = { path = "features/x11-tray/core" }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
