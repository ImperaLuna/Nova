[package]
name = "nova-cli"
description = "The nova command, and the daemon it runs as `nova daemon`"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "nova"
path = "src/main.rs"

[dependencies]
nova-protocol.workspace = true
nova-carrier.workspace = true
nova-bluetooth-api.workspace = true
nova-launcher-api.workspace = true
nova-media-api.workspace = true
nova-network-api.workspace = true
nova-notifications-api.workspace = true
nova-peripherals-api.workspace = true
nova-resources-api.workspace = true
nova-tray-api.workspace = true
nova-wallpaper-api.workspace = true
serde.workspace = true
nova-features.workspace = true
nova-paths.workspace = true
nova-quickshell.workspace = true
serde_json.workspace = true
clap.workspace = true
clap_complete.workspace = true
shlex.workspace = true
jiff.workspace = true
novad.workspace = true

[dev-dependencies]
insta.workspace = true
nova-test-support.workspace = true

[lints]
workspace = true
