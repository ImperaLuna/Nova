# Allowed outside crates:
# - clap
# - clap_complete
# - jiff
# - serde_json
# - shlex
#
# Allowed workspace crates:
# - nova-features
# - nova-paths
# - nova-protocol
# - nova-quickshell
# - novad

[package]
name = "nova-cli"
description = "The nova command, and the daemon it runs as `nova daemon`"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "nova"
path = "src/main.rs"

[dependencies]
nova-protocol.workspace = true
nova-features.workspace = true
nova-paths.workspace = true
nova-quickshell.workspace = true
serde_json.workspace = true
clap.workspace = true
clap_complete.workspace = true
shlex.workspace = true
jiff.workspace = true
novad.workspace = true

[dev-dependencies]
insta.workspace = true
nova-test-support.workspace = true

[lints]
workspace = true
