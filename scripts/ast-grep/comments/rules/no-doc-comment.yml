id: no-doc-comment
language: rust
severity: error
message: >-
  Doc comment outside the features' api crates and the framework's -info
  crates. Delete it. Name the item so it says what it does; a promise the item makes
  becomes a type or a test.
note: >-
  Only the docs of the features' api crates and the framework's -info
  crates, the contract the daemon, the UI and the fronts build on, are kept, plus a doc line
  that links the outside source of a fact (`https://`).
files:
  - "**/*.rs"
ignores:
  - "framework/*-info/**"
  - "features/*/api/**"
utils:
  linked: { kind: line_comment, regex: 'https?://' }
  run-break: { not: { kind: line_comment } }
rule:
  regex: '^(///($|[^/])|//!|/\*\*[^*/]|/\*!)'
  any:
    - kind: line_comment
    - kind: block_comment
  not:
    any:
      - regex: 'https?://'
      - follows: { matches: linked, stopBy: { matches: run-break } }
      - precedes: { matches: linked, stopBy: { matches: run-break } }
