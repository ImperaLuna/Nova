id: long-kept-doc
language: rust
severity: error
message: >-
  A kept comment runs past two lines. Cut the fact to one or two plain
  lines and its source link; anything more belongs in the code, a test or
  the PR.
note: >-
  The docs of the features' api crates and the framework's -info crates,
  the contract the daemon, the UI and the fronts build on, have no cap.
files:
  - "**/*.rs"
ignores:
  - "framework/*-info/**"
  - "features/*/api/**"
rule:
  kind: line_comment
  regex: '^(///($|[^/])|//!)'
  follows:
    kind: line_comment
    follows: { kind: line_comment }
